name: Deploy

# 14-ci-cd-design.md §2.2: main 브랜치에서 CI가 통과한 뒤에만 배포한다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ghcr_owner: ${{ steps.vars.outputs.ghcr_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: vars
        run: |
          echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "ghcr_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.ghcr_owner }}/teamflow-backend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.ghcr_owner }}/teamflow-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.ghcr_owner }}/teamflow-nginx:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.ghcr_owner }}/teamflow-nginx:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # EC2가 아직 준비되지 않았다면(Secrets 미설정) 배포 단계는 건너뛰고 이미지 빌드/푸시까지만 수행한다.
    if: needs.build-and-push.result == 'success' && secrets.EC2_HOST != ''
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/teamflow
            PREV_TAG=$(cat .deployed_tag 2>/dev/null || echo latest)
            export GHCR_OWNER="${{ needs.build-and-push.outputs.ghcr_owner }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # 14-ci-cd-design.md §5: /actuator/health가 UP이어야 배포 성공으로 간주한다.
            HEALTHY=false
            for i in $(seq 1 10); do
              if docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "$IMAGE_TAG" > .deployed_tag
            else
              echo "Health check failed, rolling back to $PREV_TAG"
              export IMAGE_TAG="$PREV_TAG"
              docker compose -f docker-compose.prod.yml up -d
              exit 1
            fi

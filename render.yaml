# Render Blueprint: "New +" -> "Blueprint" -> 이 저장소 연결 시 자동으로 아래 두 서비스가 생성된다.
# DB(Neon)/Redis(Upstash) 자격증명은 sync:false라 Blueprint 최초 적용 시 대시보드에서 값을 입력하라는
# 프롬프트가 뜬다. 자세한 절차는 docs/21-free-deployment-guide.md 참고.
services:
  - type: web
    name: teamflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # 11-file-storage-design.md의 파일 업로드는 이 무료 배포 범위 밖이다. AWS SDK가 빈 문자열은
      # 기동 시점에 거부하므로(Access key ID cannot be blank) placeholder 값을 넣어 기동은 되게 하고,
      # 파일 업로드 기능만 사용 시 인증 실패로 실패하게 한다(선택적으로 나중에 실제 값으로 채워도 된다).
      - key: S3_BUCKET
        value: unconfigured
      - key: AWS_ACCESS_KEY_ID
        value: unconfigured
      - key: AWS_SECRET_ACCESS_KEY
        value: unconfigured

  - type: web
    name: teamflow-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # 백엔드 서비스가 먼저 생성된 뒤 실제 배포 URL(https://teamflow-backend.onrender.com 등)을
      # 확인해서 넣는다 — 이름이 겹치면 Render가 다른 URL을 배정하므로 대시보드에서 재확인.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FILE_STORAGE_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

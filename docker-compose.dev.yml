services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: teamflow
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow_local
    volumes:
      - teamflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # 6379 was already taken by another local container on this machine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 11-file-storage-design.md: 운영은 AWS S3를 쓰지만, 로컬 개발은 Postgres/Redis와 같은 방식으로
  # S3 호환 오브젝트 스토리지(MinIO)를 띄워 AWS SDK(S3Presigner)를 그대로 endpoint override만으로 재사용한다.
  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    ports:
      - "9100:9000" # 9000 was already taken by another local process on this machine
      - "9101:9001" # web console
    environment:
      MINIO_ROOT_USER: teamflow
      MINIO_ROOT_PASSWORD: teamflow_local
    command: server /data --console-address ":9001"
    volumes:
      - teamflow-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  teamflow-postgres-data:
  teamflow-minio-data:

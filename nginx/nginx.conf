# 13-infrastructure-design.md §4. 포트폴리오 배포 시점에 실제 도메인/TLS 인증서가 없어 80으로 서비스한다.
# 도메인 + 인증서(예: certbot)가 준비되면 443 서버 블록과 80->443 redirect로 교체한다.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # 10-realtime-architecture.md: SSE(Notification)는 응답을 즉시 흘려보내야 하므로 버퍼링을 끈다.
    location /api/notifications/subscribe {
        proxy_pass http://backend:8080/api/notifications/subscribe;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

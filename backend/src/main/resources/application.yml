server:
  # Render는 서비스가 PORT 환경변수로 지정된 포트를 리슨하길 기대한다. 그 외(EC2/로컬)는
  # PORT가 설정되지 않으므로 기존과 동일하게 8080을 쓴다.
  port: ${PORT:8080}

spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      # 타임아웃을 안 걸면 Lettuce가 커맨드 응답을 무한정 기다린다 — Render 배포에서 Upstash 연결이
      # 순간적으로 막혔을 때 앱 기동 전체가 몇 분씩 멈춰 있다가 포트 바인딩 타임아웃으로 죽는 걸 실제로
      # 겪었다. 빨리 실패해서 재시도/재배포가 되게 한다.
      connect-timeout: 5s
      timeout: 5s

management:
  endpoints:
    web:
      exposure:
        # 16-monitoring-design.md: Prometheus가 /actuator/prometheus를 스크래핑한다.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # P50/P95/P99 응답시간 분포를 histogram_quantile()로 조회하기 위한 Prometheus Histogram Bucket.
      percentiles-histogram:
        http.server.requests: true

teamflow:
  jwt:
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 14

---
# 로컬 개발: docker-compose.dev.yml로 띄운 PostgreSQL/Redis에 연결 (13-infrastructure-design.md)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/teamflow
    username: teamflow
    password: teamflow_local
  data:
    redis:
      host: localhost
      port: 6380

teamflow:
  jwt:
    # 로컬 개발 전용 키. dev/prod는 JWT_SECRET 환경변수로 주입한다.
    secret: 07fxKSVP9sUDhQOtF19DeUYyqWqwGbWntLoajz2K+3LG9y2EuL5lAh4cDU8F6JEo
    # 로컬은 http로 접속하므로 Secure 쿠키가 전송되지 않는다 — 로컬에서만 끈다.
    cookie-secure: false
  s3:
    # 11-file-storage-design.md: 운영은 AWS S3, 로컬은 docker-compose.dev.yml의 MinIO(S3 호환)를 쓴다.
    bucket: teamflow-dev
    region: us-east-1
    endpoint: http://localhost:9100
    access-key: teamflow
    secret-key: teamflow_local
    path-style-access: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

teamflow:
  jwt:
    secret: ${JWT_SECRET}
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    path-style-access: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate

teamflow:
  jwt:
    secret: ${JWT_SECRET}
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    path-style-access: false

---
# Render(Backend/Frontend) + Neon(PostgreSQL) + Upstash(Redis) 무료 티어 배포.
# EC2(prod 프로필)와 달리 프론트/백엔드가 서로 다른 origin이라 CORS + SameSite=None이 필요하고,
# Neon/Upstash 모두 TLS 필수다. 파일 업로드(S3)는 이 무료 배포 범위 밖이라 값을 비워두면
# 해당 기능만 런타임에 실패한다(앱 기동 자체에는 영향 없음).
spring:
  config:
    activate:
      on-profile: render
  datasource:
    # Neon 대시보드의 "Direct connection"을 쓴다 — Hikari가 자체적으로 커넥션을 유지하므로
    # PgBouncer "Pooled connection"(Transaction mode)을 얹으면 Hibernate의 Prepared Statement와
    # 충돌할 수 있다. 예: jdbc:postgresql://ep-xxx.neon.tech/teamflow?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

teamflow:
  jwt:
    secret: ${JWT_SECRET}
    cookie-same-site: None
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  s3:
    # AWS SDK가 빈 문자열은 기동 시점에 거부하므로(Access key ID cannot be blank) 값이 없으면
    # placeholder로 기동은 시키고, 파일 업로드 기능만 사용 시 인증 실패로 실패하게 한다.
    bucket: ${S3_BUCKET:unconfigured}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:unconfigured}
    secret-key: ${AWS_SECRET_ACCESS_KEY:unconfigured}
    path-style-access: false
